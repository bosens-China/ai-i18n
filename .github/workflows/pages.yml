name: Deploy docs and examples to GitHub Pages

on:
  # CI 通过后的独立站点改动，或 Release 成功发布 npm 后，复用同一部署流程。
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build docs and examples
        run: pnpm docs:build
        env:
          DEPLOY_TARGET: pages
      - name: Assemble Pages artifact
        run: |
          mkdir -p site
          cp -R apps/docs/dist/. site/
          for example in vanilla vue react; do
            mkdir -p "site/examples/$example"
            cp -R "examples/$example/dist/." "site/examples/$example/"
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
