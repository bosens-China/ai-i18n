name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Release Please 合并提交由 Release workflow 对同一 SHA 执行完整门禁，避免重复运行。
    if: >-
      github.event_name == 'pull_request' ||
      github.event.head_commit.author.name != 'github-actions[bot]' ||
      github.event.head_commit.author.email != '41898282+github-actions[bot]@users.noreply.github.com' ||
      !startsWith(github.event.head_commit.message, 'chore: release main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages_only: ${{ steps.pages_changes.outputs.pages_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      # Release Please PR 中会出现 npm 尚未发布的新版本；仅验证这些候选 tarball。
      - run: pnpm release:verify
      - name: Detect standalone Pages changes
        id: pages_changes
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: pnpm exec tsx scripts/pages-deploy-policy.ts "$BEFORE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  pages:
    needs: check
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.check.result == 'success' &&
      needs.check.outputs.pages_only == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
