name: Release

on:
  push:
    branches: [main]
    # 仅在可发布包或发布配置变化时跑；纯文档/Agent/示例提交不启动
    paths:
      - 'packages/**'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsdown.config.ts'
      - 'scripts/release-package-metadata.ts'
      - 'scripts/release-packages.ts'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      publish_paths:
        description: >-
          可选。填 JSON 数组可跳过 Release Please，直接发布指定包路径（用于补发已打
          tag 但未上 npm 的版本），例如 ["packages/vite","packages/core"]。
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-lock-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Validate manual release branch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo "::error::手动发布仅允许 main 分支 / Manual publishing is only allowed from main."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify native file locking on macOS
        run: pnpm exec vitest run packages/core/test/translation-memory.test.ts

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate manual publish paths
        if: github.event_name == 'workflow_dispatch' && inputs.publish_paths != ''
        env:
          PUBLISH_PATHS: ${{ inputs.publish_paths }}
        run: pnpm exec tsx scripts/release-packages.ts validate-paths "$PUBLISH_PATHS"
      # 必须在创建 GitHub Release/tag 之前验证，避免测挂后留下孤儿 release。
      - run: pnpm check
      - run: pnpm test
      - name: Prepare and verify release packages
        id: packages
        shell: bash
        env:
          PUBLISH_PATHS: ${{ inputs.publish_paths }}
        run: |
          mkdir -p "$RUNNER_TEMP/npm-pack"
          if [[ -n "$PUBLISH_PATHS" ]]; then
            pnpm exec tsx scripts/release-packages.ts prepare-dir "$RUNNER_TEMP/npm-pack" "$PUBLISH_PATHS"
          else
            pnpm exec tsx scripts/release-packages.ts prepare-dir "$RUNNER_TEMP/npm-pack"
          fi
          if [[ -s "$RUNNER_TEMP/npm-pack/publish-order.txt" ]]; then
            echo "has-packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-packages=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        if: steps.packages.outputs.has-packages == 'true'
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-pack
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [native-lock-macos, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        if: github.event_name == 'push' || inputs.publish_paths == ''
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    needs: [release, verify]
    if: >-
      needs.release.result == 'success' &&
      needs.verify.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish_paths != '') ||
      needs.release.outputs.releases_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Trusted Publishing（OIDC）需要 npm 11+；不配置 registry-url，避免写入 NODE_AUTH_TOKEN。
      - run: npm install --global npm@11.17.0
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-pack
      - name: Select packages created by Release Please
        env:
          PACK_DIRECTORY: ${{ runner.temp }}/npm-pack
          RELEASED_PATHS: ${{ inputs.publish_paths != '' && inputs.publish_paths || needs.release.outputs.paths_released }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';

          const directory = process.env.PACK_DIRECTORY;
          const requested = JSON.parse(process.env.RELEASED_PATHS);
          if (!Array.isArray(requested)) {
            throw new Error(
              '发布路径必须是数组 / Released package paths must be an array.',
            );
          }
          const manifest = JSON.parse(
            readFileSync(path.join(directory, 'publish-manifest.json'), 'utf8'),
          );
          const requestedPaths = new Set(requested);
          const selected = manifest.packages.filter(({ path }) => requestedPaths.has(path));
          const selectedPaths = new Set(selected.map(({ path }) => path));
          const missing = requested.filter((item) => !selectedPaths.has(item));
          if (
            requested.length === 0 ||
            requestedPaths.size !== requested.length ||
            missing.length > 0
          ) {
            throw new Error(
              `发布包与已验证 artifact 不一致 / Released packages do not match the verified artifact: ${missing.join(', ')}`,
            );
          }
          writeFileSync(
            path.join(directory, 'publish-order.txt'),
            `${selected.map(({ tarball }) => tarball).join('\n')}\n`,
          );
          NODE
      - name: Publish packages
        shell: bash
        run: |
          while IFS= read -r tarball_name; do
            tarball="$RUNNER_TEMP/npm-pack/$tarball_name"
            version=$(tar -xOf "$tarball" package/package.json |
              node -e "let input=''; process.stdin.on('data', chunk => input += chunk).on('end', () => process.stdout.write(JSON.parse(input).version))")
            dist_tag=$([[ "$version" == *-* ]] && printf '%s' "${version#*-}" | cut -d. -f1 || printf 'latest')
            npm publish "$tarball" --access public --tag "$dist_tag"
          done < "$RUNNER_TEMP/npm-pack/publish-order.txt"
