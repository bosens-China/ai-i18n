name: Release

on:
  push:
    branches: [main]
    # 仅在可发布包或发布配置变化时跑；纯文档/Agent/示例提交不启动
    paths:
      - 'packages/**'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsdown.config.ts'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      publish_paths:
        description: >-
          可选。填 JSON 数组可跳过 Release Please，直接发布指定包路径（用于补发已打
          tag 但未上 npm 的版本），例如 ["packages/vite","packages/core"]。
        required: false
        type: string
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-lock-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify native file locking on macOS
        run: pnpm exec vitest run packages/core/test/translation-memory.test.ts

  release:
    needs: native-lock-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Trusted Publishing（OIDC）需要 npm 11+；不配置 registry-url，避免写入 NODE_AUTH_TOKEN。
      - run: npm install --global npm@11.17.0
      - run: pnpm install --frozen-lockfile
      # 必须在创建 GitHub Release/tag 之前验证，避免测挂后留下孤儿 release。
      - run: pnpm check
      - run: pnpm test
      - uses: googleapis/release-please-action@v4
        id: release
        if: github.event_name == 'push' || inputs.publish_paths == ''
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Publish packages
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.publish_paths != '') ||
          steps.release.outputs.releases_created == 'true'
        shell: bash
        env:
          RELEASED_PATHS: ${{ inputs.publish_paths != '' && inputs.publish_paths || steps.release.outputs.paths_released }}
        run: |
          mkdir -p "$RUNNER_TEMP/npm-pack"
          node -e 'for (const path of JSON.parse(process.env.RELEASED_PATHS)) console.log(path)' |
            while IFS= read -r package_path; do
              pack_json=$(pnpm --dir "$package_path" pack --json --pack-destination "$RUNNER_TEMP/npm-pack")
              tarball=$(printf '%s' "$pack_json" | node -e "let input=''; process.stdin.on('data', chunk => input += chunk).on('end', () => process.stdout.write(JSON.parse(input).filename))")
              dist_tag=$(node -p "const version = require('./$package_path/package.json').version; version.includes('-') ? version.split('-')[1].split('.')[0] : 'latest'")
              npm publish "$tarball" --access public --tag "$dist_tag"
            done
